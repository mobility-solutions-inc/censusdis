name: Publish to CodeArtifact

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-codeartifact.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  CODEARTIFACT_DOMAIN: ontra
  CODEARTIFACT_DOMAIN_OWNER: "156551339589"
  CODEARTIFACT_REPOSITORY: python-wheels
  UV_VERSION: 0.13.1

jobs:
  build:
    name: Build and verify (${{ matrix.name }})
    if: >-
      github.repository == 'mobility-solutions-inc/censusdis' &&
      github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Build wheel
        run: uv build --wheel

      - name: Verify wheel is platform independent
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name 'ontra_censusdis-*-py3-none-any.whl' -print -quit)"
          if [[ -z "$wheel" ]]; then
            echo "Expected one platform-independent ontra-censusdis wheel in dist/" >&2
            ls -la dist >&2
            exit 1
          fi

      - name: Install and import wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name 'ontra_censusdis-*-py3-none-any.whl' -print -quit)"
          uv venv --python 3.12 .venv-wheel
          uv pip install --python .venv-wheel/bin/python "$wheel"
          .venv-wheel/bin/python -c \
            "import censusdis; print(f'censusdis version: {censusdis.version}')"

      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ontra-censusdis-wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish wheel
    needs: build
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'mobility-solutions-inc/censusdis' &&
      github.ref == 'refs/heads/main'
    environment: aws-codeartifact
    permissions:
      contents: read
      id-token: write

    steps:
      # censusdis is a pure-Python package, so macOS and Linux produce the
      # same py3-none-any wheel. Publish one copy after both builds pass.
      - name: Download verified wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ontra-censusdis-wheel-Linux
          path: dist

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::156551339589:role/github-actions-codeartifact-censusdis
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "156551339589"
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Get CodeArtifact credentials
        id: codeartifact
        shell: bash
        run: |
          set -euo pipefail
          token="$(aws codeartifact get-authorization-token \
            --domain "$CODEARTIFACT_DOMAIN" \
            --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --query authorizationToken \
            --output text)"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

          repository_url="$(aws codeartifact get-repository-endpoint \
            --domain "$CODEARTIFACT_DOMAIN" \
            --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" \
            --repository "$CODEARTIFACT_REPOSITORY" \
            --format pypi \
            --query repositoryEndpoint \
            --output text)"
          echo "repository-url=$repository_url" >> "$GITHUB_OUTPUT"
          echo "check_url=${repository_url%/}/simple/" >> "$GITHUB_OUTPUT"

      - name: Publish to CodeArtifact
        env:
          CODEARTIFACT_TOKEN: ${{ steps.codeartifact.outputs.token }}
          CHECK_URL: ${{ steps.codeartifact.outputs.check_url }}
          REPOSITORY_URL: ${{ steps.codeartifact.outputs.repository-url }}
        run: >-
          uv publish dist/*.whl
          --publish-url "$REPOSITORY_URL"
          --check-url "$CHECK_URL"
          --username aws
          --password "$CODEARTIFACT_TOKEN"
