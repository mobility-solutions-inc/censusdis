# Exercise live Census API queries with the protected key after merging to main.
name: main-test

on:
  push:
    branches:
      - main
    paths:
      - "censusdis/**"
      - "tests/**"
      - "utils/**"
      - "conftest.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/main-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-test:
    if: >-
      github.repository == 'mobility-solutions-inc/censusdis' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: main-secrets
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: Run tests with Census API key
        env:
          US_CENSUS_API_KEY: ${{ secrets.US_CENSUS_API_KEY }}
        run: |
          if [ -z "$US_CENSUS_API_KEY" ]; then
            echo "::error::US_CENSUS_API_KEY must be configured in the main-secrets environment."
            exit 1
          fi
          uv run --no-sync python -m pytest tests
      - name: Archive test artifacts
        if: ${{ !cancelled() && hashFiles('tests/_test_artifacts') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test_artifacts
          path: tests/_test_artifacts
          retention-days: 7
