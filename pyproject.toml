[project]
name = "censusdis"
version = "1.4.2"
description = "US Census utilities for a variety of data loading, analysis, and mapping purposes."
license = "LicenseRef-HL3-CL-ECO-EXTR-FFD-LAW-MIL-SV"
license-files = ["LICENSE.md"]
authors = [{ name = "Darren Vengroff" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
keywords = ["census", "demographics"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research"
]
dependencies = [
    "logargparser>=0.1.1,<0.2.0",
    "geopandas==1.1.4",
    "pandas>=3.0.0,<4.0.0",
    # Back the pandas 3 string dtype with PyArrow rather than Python objects.
    "pyarrow>=25.0.0,<26.0.0",
    "Rtree>=1.0.0,<2.0.0",
    # Matplotlib 3.11 changes label rendering enough to break the map image contract.
    "matplotlib>=3.9.1,<3.11",
    "toml>=0.10.2,<0.11.0",
    "requests>=2.32.0,<3.0.0",
    "geopy>=2.2.0,<3.0.0",
    "adjustText>=0.8,<0.9",
    "Fiona>=1.10.0,<2.0.0",
    "contextily>=1.3.0,<2.0.0",
    "haversine>=2.8.0,<3.0.0",
    "PyYAML>=6.0,<7.0",
    "usingversion>=0.1.1,<0.2.0",
    "pyogrio>=0.10.0,<0.11.0",
    "rasterio>=1.3.10,<2.0.0",
    # Jinja2 is a recursive dependency along several paths. Make sure
    # we have a patched version that fixes a security issue raised by
    # dependabot. Once intermediate packages get this dependency upgrade
    # we can delete it here.
    "jinja2>=3.1.4",
    "numpy>=2.0.0,<3.0.0",
    # Deal with a certificate issue. See
    # https://uscensusbureau.slack.com/archives/CC7DYQ8PM/p1752773503093109
    "certifi==2025.01.31",
]

[project.optional-dependencies]
explore = [
    "mapclassify>=2.7.0,<3.0.0",
    "ipyleaflet>=0.19.0,<0.20.0",
    "folium>=0.17.0,<0.18.0",
]
docs = [
    "Sphinx>=6.1.3,<7.0.0",
    "sphinx-rtd-theme==2.0.0",
    "sphinx-copybutton>=0.5.1,<0.6.0",
    "sphinxcontrib-napoleon==0.7",
    "nbsphinx>=0.9.3,<0.10.0",
    "toml>=0.10.2,<0.11.0",
]
jupyterlab = [
    "jupyterlab>=4.6.2,<5.0.0",
    "ipywidgets>=8.1.3,<9.0.0",
]

[project.urls]
Repository = "https://github.com/vengroff/censusdis"

[project.scripts]
censusdis = "censusdis.cli.cli:main"

[dependency-groups]
test = [
    "coverage[toml]>=6.5.0,<7.0.0",
    "nbmake>=1.3.5,<2.0.0",
    "pytest>=7.1.3,<10.0.0",
    "pytest-cov>=3.0.0,<4.0.0",
    "scikit-image>=0.24.0,<0.25.0",
]
lint = [
    "flake8>=7.0.0,<8.0.0",
    "mypy>=0.971,<1.0.0",
    "pylint>=2.15.2,<3.0.0",
    "ruff>=0.15.21,<0.16.0",
    "types-requests>=2.28.10,<3.0.0",
]
dist = [
    "genbadge[all]>=1.1.0,<2.0.0",
]
dev = [
    { include-group = "dist" },
    { include-group = "lint" },
    { include-group = "test" },
    "notebook>=7.2.2,<8.0.0",
]

[tool.coverage.report]
omit = ["tests/*"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "censusdis"
module-root = ""

[tool.ruff.lint]
select = ["D", "I"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
