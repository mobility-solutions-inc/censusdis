# Run unit tests every time a branch is pushed. This is the simplest
# version of unit testing, just on a single platform.
#
# See also:
#    test-matrix.yml: run on all platforms for each pull request
#    coverage-report.yml: runs on merge to main to generate coverage reports

name: unit-test

on:
  push:
    branches-ignore:
      - main
    paths:
      - "censusdis/**"
      - "tests/**"
      - "utils/**"
      - "pyproject.toml"
      - "poetry.lock"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # List the tests
  list-tests:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.test-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: test-matrix
        run: echo "matrix=$(find tests -name "*.py" | sed -e s/^tests\\/// | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT
  unit-test:
    needs: list-tests
    runs-on: ubuntu-latest
    env:
      US_CENSUS_API_KEY: ${{ secrets.US_CENSUS_API_KEY }}
    strategy:
      max-parallel: 4
      matrix:
        test: ${{ fromJson(needs.list-tests.outputs.matrix) }}
      fail-fast: false
    steps:
      #----------------------------------------------
      #       check out repo
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ssh-key:
            ${{secrets.DEPLOY_ACTION_SECRET}}
      #----------------------------------------------
      #       set up python
      #----------------------------------------------
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.32
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test
      #----------------------------------------------
      #              log the version
      #----------------------------------------------
      - name: Log version
        id: logVersions
        run: >-
          uv run --no-sync python -c "import censusdis; print(f'censusdis version: {censusdis.version}')"
      #----------------------------------------------
      #              run test suite
      #----------------------------------------------
      - name: Run tests
        id: runTests
        run: |
          echo "${{matrix.test}}"
          uv run --no-sync python -m pytest "tests/${{matrix.test}}"
      #----------------------------------------------
      #              archive test artifacts
      #----------------------------------------------
      - name: Archive test artifacts
        if: ${{ !cancelled() && hashFiles('tests/_test_artifacts') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: test_artifacts-${{ matrix.test }}
          path: tests/_test_artifacts
          retention-days: 7
