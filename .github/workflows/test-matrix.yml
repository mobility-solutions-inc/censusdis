# Run a matrix of tests across supported Python versions on Linux.
# This is run on each pull request.
#
# See also:
#    unit-test.yml: run on a single platform every time a branch is pushed
#    coverage-report.yml: runs on merge to main to generate coverage reports

name: test-matrix

on: pull_request

jobs:
  test-matrix:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    env:
      US_CENSUS_API_KEY: ${{ secrets.US_CENSUS_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install GDAL build dependencies
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgdal-dev
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.4.1
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Load cached venv
        id: cached-pip-wheels
        uses: actions/cache@v6
        with:
          path: ~/.cache
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Install library
        run: poetry install --no-interaction
      - name: Log version
        run: |
          source $VENV
          python -c "import censusdis; print(f'censusdis version: {censusdis.version}')"
      - name: Run tests
        run: |
          source $VENV
          python -m pytest tests
      - name: Archive test artifacts
        if: ${{ !cancelled() && hashFiles('tests/_test_artifacts') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: test_artifacts-${{ matrix.python-version }}
          path: tests/_test_artifacts
          retention-days: 7
