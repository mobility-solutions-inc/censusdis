# Automates running symbolic.py to generate the dataset constants module.
# When the generated module changes, this workflow opens or updates a pull
# request so the change follows the same review rules as other changes.

name: generate-dataset

on:
  schedule:
    # The census servers update at midnight ET. Let's try to be just
    # after that regardless of whether we are in EST or EDT.
    - cron: '17 5 * * *'
  push:
    branches:
      - main
    paths:
      - "censusdis/**"
      - "tests/**"
      - "utils/**"
      - "pyproject.toml"
      - "uv.lock"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-dataset
  cancel-in-progress: false

jobs:
  generate-dataset:
    if: >-
      github.repository == 'mobility-solutions-inc/censusdis' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: main-secrets
    steps:
      #----------------------------------------------
      #       check out repo
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      #----------------------------------------------
      #       set up python
      #----------------------------------------------
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.12
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.32
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked --no-default-groups
      #----------------------------------------------
      #         automates updating datasets
      #----------------------------------------------
      - name: Run symbolic.py to update datasets file
        env:
          US_CENSUS_API_KEY: ${{ secrets.US_CENSUS_API_KEY }}
        run: uv run --no-sync python utils/symbolic.py datasets.py
      #----------------------------------------------
      #       open or update generated-data PR
      #----------------------------------------------
      - name: Create or update datasets pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          add-paths: censusdis/datasets.py
          base: main
          branch: automation/update-datasets
          commit-message: Update datasets [github action]
          delete-branch: true
          sign-commits: true
          title: Update Census datasets
          body: |
            Regenerates `censusdis/datasets.py` from the current Census API dataset catalog.

            This pull request is maintained automatically by the `generate-dataset` workflow.
