# Generate a test coverage report and commit it back to the repo
# and push. This is run after a PR is merged so that the coverage
# report is kept up to date with respect to what is on the main
# branch.
#
# See also:
#    unit-test.yml: run on a single platform every time a branch is pushed
#    test-matrix.yml: run on all platforms for each pull request

name: coverage-report

on:
  push:
    branches:
      - main
    paths:
      - "censusdis/**"
      - "tests/**"
      - "utils/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/coverage-report.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: coverage-report
  cancel-in-progress: false

jobs:
  test-coverage:
    if: >-
      github.repository == 'mobility-solutions-inc/censusdis' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: main-secrets
    steps:
      #----------------------------------------------
      #       check out repo
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      #----------------------------------------------
      #       set up python
      #----------------------------------------------
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.1
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test --group dist
      #----------------------------------------------
      #              run test suite
      #----------------------------------------------
      - name: Run tests with coverage
        id: runTests
        env:
          US_CENSUS_API_KEY: ${{ secrets.US_CENSUS_API_KEY }}
        run: uv run --no-sync coverage run -m pytest --junitxml=reports/junit/junit.xml
      #----------------------------------------------
      #              archive test artifacts
      #----------------------------------------------
      - name: Archive test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test_artifacts
          path: tests/_test_artifacts
          retention-days: 7
      #----------------------------------------------
      #              generate coverage
      #----------------------------------------------
      - name: Generate coverage reports and badges
        run: |
          uv run --no-sync coverage report
          uv run --no-sync coverage xml -o ./reports/coverage/coverage.xml
          uv run --no-sync coverage html -d ./reports/coverage
          uv run --no-sync genbadge coverage -n coverage -o ./reports/coverage/coverage-badge.svg
          uv run --no-sync genbadge tests --name tests -i reports/junit/junit.xml -o ./reports/junit/tests-badge.svg
      #----------------------------------------------
      #            publish coverage
      #----------------------------------------------
      - name: Create or update coverage report pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          add-paths: |
            reports/coverage
            reports/junit/tests-badge.svg
          base: main
          branch: automation/update-coverage-reports
          commit-message: Update coverage reports [github action]
          delete-branch: true
          sign-commits: true
          title: Update coverage reports
          body: |
            Regenerates the coverage report and test badges from the current `main` branch.

            This pull request is maintained automatically by the `coverage-report` workflow.
