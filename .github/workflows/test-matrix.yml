# Run a matrix of tests across supported Python versions on Linux.
# This is run on each pull request.
#
# See also:
#    unit-test.yml: run on a single platform every time a branch is pushed

name: test-matrix

on:
  pull_request:
    paths:
      - "censusdis/**"
      - "tests/**"
      - "utils/**"
      - "conftest.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test-matrix.yml"

permissions:
  contents: read

jobs:
  test-matrix:
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.5
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: Log version
        run: >-
          uv run --no-sync python -c "import censusdis; print(f'censusdis version: {censusdis.version}')"
      - name: Run tests
        run: uv run --no-sync python -m pytest tests
      - name: Archive test artifacts
        if: ${{ !cancelled() && hashFiles('tests/_test_artifacts') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test_artifacts-${{ matrix.python-version }}
          path: tests/_test_artifacts
          retention-days: 7
