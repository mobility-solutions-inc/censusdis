# Exercise live Census API queries with the protected key after merging to main.
name: main-test

on:
  push:
    branches:
      - main
    paths:
      - "censusdis/**"
      - "tests/**"
      - "utils/**"
      - "conftest.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/main-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-test:
    if: >-
      github.repository == 'mobility-solutions-inc/censusdis' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: main-secrets
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.4
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: Run tests with Census API key
        env:
          US_CENSUS_API_KEY: ${{ secrets.US_CENSUS_API_KEY }}
        run: |
          if [ -z "$US_CENSUS_API_KEY" ]; then
            echo "::error::US_CENSUS_API_KEY must be configured in the main-secrets environment."
            exit 1
          fi
          uv run --no-sync python -m pytest tests
      - name: Archive test artifacts
        if: ${{ !cancelled() && hashFiles('tests/_test_artifacts') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test_artifacts
          path: tests/_test_artifacts
          retention-days: 7
