# Test that all the notebooks run properly. This is a sort of simple
# unit test. We don't assert that the notebooks produce any particuler
# expected results, but we at least know they keep running as we make
# changes to the underlying library.
name: nbmake

on:
  push:
    branches-ignore:
      - main
    paths:
      - "censusdis/**"
      - "notebooks/**"
      - "conftest.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/nbmake.yml"

permissions:
  contents: read

jobs:
  # List the notebooks
  list-notebooks:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.notebook-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: notebook-matrix
        run: echo "matrix=$(find notebooks -name "*.ipynb" | jq -R -s -c 'split("\n")[:-1]')" >> $GITHUB_OUTPUT
  nbmake:
    needs: list-notebooks
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        notebook: ${{ fromJson(needs.list-notebooks.outputs.matrix) }}
      fail-fast: false
    steps:
      #----------------------------------------------
      #       check-out repo and set-up python
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.4
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test --extra explore
      #----------------------------------------------
      #              test run notebooks
      #----------------------------------------------
      - name: Test run notebook
        env:
          NOTEBOOK: ${{ matrix.notebook }}
        run: uv run --no-sync pytest --nbmake --nbmake-timeout=600 "$NOTEBOOK"
